#
# Android APK build. Manually triggered ONLY - there is deliberately no
# push/pull_request/schedule trigger to avoid burning runner minutes.

name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake/Gradle build type"
        type: choice
        default: Release
        options:
          - Release
          - Debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_VERSION: "7.1.1"
  NDK_VERSION: "28.1.13356709"

jobs:
  android:
    name: Android ${{ inputs.build_type || 'Release' }} (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout (inlined sources, no submodules needed)
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # externals/sdl3 ships its own android-project Gradle wrapper JAR that
          # is not an official Gradle distribution wrapper, so automatic wrapper
          # validation (enabled by default) fails on it. Disable it here; the
          # android/gradle wrapper used for the real build is tracked and known-good.
          validate-wrappers: false

      - name: Set up Android SDK pieces
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache FFmpeg install prefix
        uses: actions/cache@v5
        with:
          path: android/build/ffmpeg-install
          # v3: invalidate any prefix built before --disable-asm was added
          # (those .a archives contain tx_float_neon.o, which fails the
          # final libmain.so link with R_AARCH64_ADR_PREL_PG_HI21).
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-arm64-v8a-noasm-v3

      - name: Cache host protoc
        uses: actions/cache@v5
        with:
          path: android/build/host-protoc
          # Bumping the cache suffix (v2) invalidates any stale host-protoc
          # directories produced before Dear_ImGui_FontEmbed and glslang
          # were added to the host tools build.
          key: host-protoc-v2

      - name: Build native libraries (protoc + FFmpeg + emulator)
        shell: bash
        run: |
          bash android/build_native.sh "${{ inputs.build_type || 'Release' }}"

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon "assemble${{ inputs.build_type || 'Release' }}"

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          TYPE="${{ inputs.build_type || 'Release' }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          # Signed builds produce app-release.apk, unsigned ones
          # app-release-unsigned.apk - accept both.
          SRC="$(ls android/app/build/outputs/apk/${TYPE,,}/app-${TYPE,,}*.apk | head -n 1)"
          [[ -n "${SRC}" ]] || { echo "No APK found"; exit 1; }
          DST="shadPS4-android-${TYPE,,}-${SHORT_SHA}.apk"
          cp "${SRC}" "${DST}"
          sha256sum "${DST}" > "${DST}.sha256"
          echo "APK_NAME=${DST}" >> "${GITHUB_ENV}"
          ls -lh "${DST}"

      - name: Sign APK (if unsigned)
        shell: bash
        run: |
          set -euo pipefail
          APK="${APK_NAME}"

          # Check if APK is already signed
          if "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${APK}" 2>/dev/null | grep -q "Signer"; then
            echo "APK is already signed, skipping."
          else
            echo "APK is unsigned, signing with debug keystore..."

            # Generate a debug keystore for CI signing
            DEBUG_KEYSTORE="ci-debug.keystore"
            keytool -genkeypair \
              -keystore "${DEBUG_KEYSTORE}" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            # Align the APK for optimal performance
            "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -f -v -p 4 "${APK}" "${APK}.aligned"

            # Sign the aligned APK
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
              --ks "${DEBUG_KEYSTORE}" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              "${APK}.aligned"

            # Replace original with signed version
            mv "${APK}.aligned" "${APK}"

            # Verify signature
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "${APK}"

            # Update checksum
            sha256sum "${APK}" > "${APK}.sha256"

            echo "APK successfully signed!"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APK_NAME }}
          path: |
            shadPS4-android-*.apk
            shadPS4-android-*.apk.sha256
          if-no-files-found: error
          retention-days: 30